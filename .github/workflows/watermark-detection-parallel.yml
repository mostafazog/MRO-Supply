name: Parallel Watermark Detection (250 Workers)

on:
  workflow_dispatch:
    inputs:
      workers:
        description: 'Number of workers (chunks already exist on server)'
        required: false
        default: '250'

env:
  SERVER_HOST: srv1164617.hstgr.cloud
  SERVER_USER: root
  SSHPASS: ${{ secrets.SERVER_PASSWORD }}
  CHUNKS_DIR: /home/hstgr-srv1164617/image_chunks

jobs:
  # Job 1: Verify chunks exist and set matrix
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Setup SSH
        run: |
          sudo apt-get update && sudo apt-get install -y sshpass
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ env.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Check chunks on server
        id: check
        run: |
          CHUNK_COUNT=$(sshpass -e ssh -o StrictHostKeyChecking=no ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }} \
            "ls ${{ env.CHUNKS_DIR }}/*.tar.gz 2>/dev/null | wc -l")

          echo "Found $CHUNK_COUNT chunks on server"

          if [ "$CHUNK_COUNT" -eq 0 ]; then
            echo "ERROR: No chunks found! Please run chunk creation first."
            exit 1
          fi

          echo "chunk_count=$CHUNK_COUNT" >> $GITHUB_OUTPUT

      - name: Set matrix
        id: set-matrix
        run: |
          CHUNK_COUNT=${{ steps.check.outputs.chunk_count }}
          MATRIX=$(seq 0 $((CHUNK_COUNT - 1)) | jq -R . | jq -s -c .)
          echo "matrix={\"chunk\":$MATRIX}" >> $GITHUB_OUTPUT
          echo "Processing $CHUNK_COUNT chunks"

  # Job 2: Process each chunk
  process:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 20  # Reduced to avoid SSH rate limiting
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache EasyOCR models
        uses: actions/cache@v4
        with:
          path: ~/.EasyOCR
          key: easyocr-en-v1

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y sshpass
          pip install easyocr pillow

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ env.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Download and process chunk ${{ matrix.chunk }}
        run: |
          CHUNK_NUM=$(printf '%03d' ${{ matrix.chunk }})

          # Random delay (0-30s) to stagger SSH connections and avoid rate limiting
          DELAY=$((RANDOM % 30))
          echo "Worker ${{ matrix.chunk }}: waiting ${DELAY}s to stagger connections..."
          sleep $DELAY

          echo "=== Downloading chunk $CHUNK_NUM ==="

          # Retry loop for SSH rate limiting
          MAX_RETRIES=5
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $i of $MAX_RETRIES..."

            if sshpass -e scp -o StrictHostKeyChecking=no -o ConnectTimeout=60 \
              ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}:${{ env.CHUNKS_DIR }}/chunk_${CHUNK_NUM}.tar.gz . 2>&1; then
              echo "Download successful!"
              break
            else
              echo "Attempt $i failed, waiting before retry..."
              if [ $i -lt $MAX_RETRIES ]; then
                sleep $((10 + RANDOM % 20))
              else
                echo "All retries failed!"
                touch watermarked_${{ matrix.chunk }}.txt
                exit 0
              fi
            fi
          done

          echo "Extracting..."
          tar -xzf chunk_${CHUNK_NUM}.tar.gz

          IMAGE_COUNT=$(find chunk_${CHUNK_NUM} -name "*.jpg" 2>/dev/null | wc -l)
          echo "Processing $IMAGE_COUNT images..."

          python3 << 'PYTHON'
          import easyocr
          from pathlib import Path

          CHUNK_ID = ${{ matrix.chunk }}
          CHUNK_NUM = f"{CHUNK_ID:03d}"
          PATTERNS = ['mrosupply', 'mro supply', 'mrosupply.com', 'www.mrosupply']

          images = list(Path(f"chunk_{CHUNK_NUM}").glob("*.jpg"))
          print(f"Worker {CHUNK_ID}: {len(images)} images")

          if not images:
              open(f"watermarked_{CHUNK_ID}.txt", 'w').close()
              exit(0)

          reader = easyocr.Reader(['en'], gpu=False)
          watermarked = []

          for i, img in enumerate(images):
              try:
                  text = ' '.join([r[1].lower() for r in reader.readtext(str(img))])
                  if any(p in text for p in PATTERNS):
                      watermarked.append(img.name)
                  if (i+1) % 100 == 0:
                      print(f"{i+1}/{len(images)}, found {len(watermarked)}")
              except:
                  pass

          with open(f"watermarked_{CHUNK_ID}.txt", 'w') as f:
              f.write('\n'.join(watermarked))
          print(f"Done! {len(watermarked)} watermarked")
          PYTHON

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ matrix.chunk }}
          path: watermarked_${{ matrix.chunk }}.txt

  # Job 3: Combine results
  combine:
    needs: process
    runs-on: ubuntu-latest
    steps:
      - name: Download results
        uses: actions/download-artifact@v4
        with:
          pattern: result-*
          path: results/
          merge-multiple: true

      - name: Setup SSH
        run: |
          sudo apt-get update && sudo apt-get install -y sshpass
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ env.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Combine and map paths
        run: |
          # Get server paths
          sshpass -e scp -o StrictHostKeyChecking=no \
            ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}:${{ env.CHUNKS_DIR }}/server_paths.txt .

          # Combine results
          cat results/watermarked_*.txt 2>/dev/null | sort | uniq > watermarked_filenames.txt
          echo "Found $(wc -l < watermarked_filenames.txt) watermarked"

          # Map to server paths
          python3 << 'PYTHON'
          paths = {}
          with open('server_paths.txt') as f:
              for line in f:
                  p = line.strip()
                  if p:
                      paths[p.split('/')[-1]] = p

          with open('watermarked_filenames.txt') as f:
              names = [l.strip() for l in f if l.strip()]

          mapped = [paths[n] for n in names if n in paths]

          with open('watermarked_images.txt', 'w') as f:
              f.write('\n'.join(mapped))
          print(f"Mapped {len(mapped)} paths")
          PYTHON

          echo "TOTAL: $(wc -l < watermarked_images.txt) watermarked images"

      - name: Upload to server
        run: |
          sshpass -e scp -o StrictHostKeyChecking=no watermarked_images.txt \
            ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}:/home/hstgr-srv1164617/watermarked_images.txt
          echo "Uploaded to server"

      - name: Create replacement script
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }} << 'REMOTE'
          cat > /home/hstgr-srv1164617/replace_watermarked.sh << 'SCRIPT'
          #!/bin/bash
          PH="/home/hstgr-srv1164617/htdocs/srv1164617.hstgr.cloud/img/p/en-default-large_default.jpg"
          FILE="/home/hstgr-srv1164617/watermarked_images.txt"
          count=0; total=$(wc -l < "$FILE")
          while read img; do
            [ -f "$img" ] || continue
            dir=$(dirname "$img"); base=$(basename "$img" .jpg)
            cp "$PH" "$img"
            for s in small cart home medium large; do cp "$PH" "$dir/${base}-${s}_default.jpg" 2>/dev/null; done
            count=$((count+1))
            [ $((count%500)) -eq 0 ] && echo "Replaced $count/$total..."
          done < "$FILE"
          echo "Done! Replaced $count images"
          SCRIPT
          chmod +x /home/hstgr-srv1164617/replace_watermarked.sh
          REMOTE

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: watermarked-final
          path: watermarked_images.txt
          retention-days: 30

      - name: Summary
        run: |
          TOTAL=$(wc -l < watermarked_images.txt)
          echo "## Watermark Detection Complete" >> $GITHUB_STEP_SUMMARY
          echo "- **Watermarked:** $TOTAL images" >> $GITHUB_STEP_SUMMARY
          echo "### Replace:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo 'nohup bash /home/hstgr-srv1164617/replace_watermarked.sh > replace.log 2>&1 &' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
