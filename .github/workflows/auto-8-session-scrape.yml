name: Automated 8-Session Sequential Scraping

on:
  workflow_dispatch:
    inputs:
      workers_per_session:
        description: 'Workers per session (MAX: 18 due to GitHub 20-job limit)'
        required: false
        default: '18'
      delay_between_sessions:
        description: 'Delay between sessions in hours (recommended: 6-8)'
        required: false
        default: '7'

permissions:
  actions: write
  contents: read

jobs:
  orchestrator:
    name: 8-Session Scraping Orchestrator
    runs-on: ubuntu-latest
    timeout-minutes: 5760  # 96 hours max (4 days)

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install GitHub CLI
        run: |
          type -p curl >/dev/null || (sudo apt update && sudo apt install curl -y)
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
          sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt update
          sudo apt install gh -y

      - name: Authenticate GitHub CLI
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

      - name: Run 8-Session Sequential Scraping
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKERS: ${{ github.event.inputs.workers_per_session }}
          DELAY_HOURS: ${{ github.event.inputs.delay_between_sessions }}
        run: |
          python3 << 'PYTHON_EOF'
          import subprocess
          import time
          import json
          import sys
          import os

          WORKERS = int(os.environ.get('WORKERS', '18'))
          DELAY_HOURS = int(os.environ.get('DELAY_HOURS', '7'))
          DELAY_SECONDS = DELAY_HOURS * 3600

          # Define the 8-session schedule (1,886 batches each, ~189K products per session)
          # Each session: ~105 batches per worker with 18 workers
          # Estimated time per session: 4-5 hours (safely under 6h GitHub limit)
          schedule = [
              {"session": 1, "start": 0, "end": 1886, "products": "0-189K"},
              {"session": 2, "start": 1886, "end": 3772, "products": "189K-377K"},
              {"session": 3, "start": 3772, "end": 5658, "products": "377K-566K"},
              {"session": 4, "start": 5658, "end": 7544, "products": "566K-754K"},
              {"session": 5, "start": 7544, "end": 9430, "products": "754K-943K"},
              {"session": 6, "start": 9430, "end": 11316, "products": "943K-1.1M"},
              {"session": 7, "start": 11316, "end": 13202, "products": "1.1M-1.3M"},
              {"session": 8, "start": 13202, "end": 15088, "products": "1.3M-1.5M"}
          ]

          print("="*80)
          print("🤖 AUTOMATED 8-SESSION SCRAPING ORCHESTRATOR")
          print("="*80)
          print(f"Workers per session: {WORKERS}")
          print(f"Batches per worker: ~{1886 // WORKERS}")
          print(f"Delay between sessions: {DELAY_HOURS} hours")
          print(f"Estimated time per session: 4-5 hours")
          print(f"Total estimated time: ~{8 * 4.5 + 7 * DELAY_HOURS:.0f} hours ({(8 * 4.5 + 7 * DELAY_HOURS) / 24:.1f} days)")
          print(f"✅ Configuration optimized to stay under GitHub's 6h job timeout")
          print("="*80)

          results = []

          for config in schedule:
              session = config["session"]
              start_batch = config["start"]
              end_batch = config["end"]
              products_range = config["products"]

              print(f"\n📅 SESSION {session}/8: Starting scrape for batches {start_batch}-{end_batch} ({products_range})")
              print(f"   Launching workflow with {WORKERS} workers...")

              # Launch the workflow
              cmd = [
                  'gh', 'workflow', 'run', 'distributed-scrape-image-filter.yml',
                  '--repo', 'mostafazog/MRO-Supply',
                  '--field', f'github_workers={WORKERS}',
                  '--field', f'start_batch={start_batch}',
                  '--field', f'end_batch={end_batch}'
              ]

              try:
                  result = subprocess.run(cmd, capture_output=True, text=True, check=True)
                  print(f"   ✅ Session {session} workflow launched successfully!")
              except subprocess.CalledProcessError as e:
                  print(f"   ❌ Failed to launch Session {session} workflow: {e}")
                  print(f"   Error output: {e.stderr}")
                  sys.exit(1)

              # Wait a few seconds for the workflow to start
              time.sleep(10)

              # Get the workflow run ID
              print(f"   ⏳ Waiting for Session {session} workflow to start...")
              time.sleep(5)

              # Get latest run
              cmd = [
                  'gh', 'run', 'list',
                  '--repo', 'mostafazog/MRO-Supply',
                  '--workflow', 'distributed-scrape-image-filter.yml',
                  '--limit', '1',
                  '--json', 'databaseId,status,conclusion,createdAt'
              ]

              try:
                  result = subprocess.run(cmd, capture_output=True, text=True, check=True)
                  runs = json.loads(result.stdout)
                  if runs:
                      run_id = runs[0]['databaseId']
                      print(f"   📊 Session {session} Run ID: {run_id}")
                      print(f"   🔗 Monitor at: https://github.com/mostafazog/MRO-Supply/actions/runs/{run_id}")
                  else:
                      print(f"   ⚠️  Could not get run ID for Session {session}")
                      run_id = "unknown"
              except Exception as e:
                  print(f"   ⚠️  Error getting run ID: {e}")
                  run_id = "unknown"

              # Monitor the workflow until completion
              print(f"   ⏳ Monitoring Session {session} progress...")
              check_interval = 300  # Check every 5 minutes
              max_wait = 21600  # Max 6 hours (GitHub timeout limit)
              elapsed = 0

              while elapsed < max_wait:
                  time.sleep(check_interval)
                  elapsed += check_interval

                  # Check workflow status
                  cmd = [
                      'gh', 'run', 'view', str(run_id),
                      '--repo', 'mostafazog/MRO-Supply',
                      '--json', 'status,conclusion'
                  ]

                  try:
                      result = subprocess.run(cmd, capture_output=True, text=True, check=True)
                      run_data = json.loads(result.stdout)
                      status = run_data.get('status', 'unknown')
                      conclusion = run_data.get('conclusion', '')

                      if status == 'completed':
                          if conclusion == 'success':
                              print(f"   ✅ Session {session} completed successfully after {elapsed/3600:.1f} hours!")
                              results.append({"session": session, "status": "success", "run_id": run_id})
                              break
                          else:
                              print(f"   ❌ Session {session} failed with conclusion: {conclusion}")
                              results.append({"session": session, "status": "failed", "run_id": run_id, "conclusion": conclusion})
                              break
                      else:
                          print(f"   ⏳ Session {session} still running... ({elapsed/3600:.1f}h elapsed)")

                  except Exception as e:
                      print(f"   ⚠️  Error checking status: {e}")

              # Check if we timed out
              if elapsed >= max_wait:
                  print(f"   ⚠️  Session {session} exceeded maximum wait time (6 hours)")
                  results.append({"session": session, "status": "timeout", "run_id": run_id})

              # Wait between sessions (except after the last session)
              if session < 8:
                  print(f"\n   😴 Waiting {DELAY_HOURS} hours before Session {session + 1}...")
                  print(f"   💡 This gives the server a break and ensures respectful scraping")
                  time.sleep(DELAY_SECONDS)

          # Final summary
          print("\n" + "="*80)
          print("🎉 8-SESSION SCRAPING COMPLETE!")
          print("="*80)

          for result in results:
              status_icon = "✅" if result["status"] == "success" else "❌"
              print(f"{status_icon} Session {result['session']}: {result['status']} (Run ID: {result['run_id']})")

          successful_sessions = sum(1 for r in results if r["status"] == "success")
          print(f"\n✅ Successfully completed: {successful_sessions}/8 sessions")
          print(f"📊 Estimated products scraped: ~{successful_sessions * 170000:,}")
          print("="*80)

          # Exit with error if not all sessions succeeded
          if successful_sessions < 8:
              sys.exit(1)

          PYTHON_EOF

      - name: Summary
        if: always()
        run: |
          echo "### 8-Session Scraping Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check the logs above for detailed results from each session." >> $GITHUB_STEP_SUMMARY
